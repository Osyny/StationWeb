<ng-container *ngIf="user">
  <div class="container-fluid container-fluid--height">
    <app-header></app-header>
    <main>
      <div class="content d-flex">
        <sidebar></sidebar>
        <div class="authorized-main-box"><router-outlet></router-outlet></div>
      </div>
    </main>
  </div>
</ng-container>

<ng-container *ngIf="user === null && user === undefined">
  <div class="main-box">
    <router-outlet></router-outlet>
  </div>
</ng-container>
